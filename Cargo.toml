[package]
name = "crypto"
version = "0.1.0"
edition = "2021"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aes-gcm = "0.10"
bincode = "1.3"
wasm-bindgen = "0.2"
js-sys = "0.3"
sha2 = "0.10"
base64 = "0.21"
serde = { version = "1.0", features = ["derive"] }
getrandom = { version = "0.2", features = ["js"] }
rand = "0.8"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
