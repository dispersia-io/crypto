name: Security & Audit

on:
  push:
    branches: [main, canary]
  pull_request:
    branches: [main, canary]
  workflow_call:
  schedule:
    - cron: '0 0 * * 1'

jobs:
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Run audit
        run: cargo audit

  deny:
    name: Cargo Deny (Licenses & Database)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check dependencies via cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2

  static-analysis:
    name: Clippy & Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust Component
        run: rustup component add clippy

      - name: Run Clippy
        run: cargo clippy -- -D clippy::pedantic -D warnings

  verification:
    name: Kani Formal Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify code with Kani
        uses: model-checking/kani-github-action@v1
        with:
          args: --tests

  fuzzing-regression:
    name: Fuzz (regression, ${{ matrix.target }})
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [fuzz_decrypt, fuzz_roundtrip]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust Nightly
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly

      - name: Cache cargo-fuzz binary
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: ${{ runner.os }}-cargo-fuzz-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cargo-fuzz-

      - name: Install cargo-fuzz
        run: |
          cargo fuzz --version || cargo install cargo-fuzz

      - name: Restore fuzz corpus
        uses: actions/cache/restore@v6
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: ${{ runner.os }}-fuzz-corpus-${{ matrix.target }}-
          restore-keys: |
            ${{ runner.os }}-fuzz-corpus-${{ matrix.target }}-

      - name: Run fuzz target (2 min)
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=120

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crash-${{ matrix.target }}-${{ github.run_id }}
          path: fuzz/artifacts/${{ matrix.target }}/

  fuzzing-deep:
    name: Fuzz (deep, ${{ matrix.target }})
    if: github.event_name == 'workflow_call' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [fuzz_decrypt, fuzz_roundtrip]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust Nightly
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly

      - name: Cache cargo-fuzz binary
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: ${{ runner.os }}-cargo-fuzz-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cargo-fuzz-

      - name: Install cargo-fuzz if not cached
        run: |
          cargo fuzz --version || cargo install cargo-fuzz

      - name: Restore/save fuzz corpus
        uses: actions/cache@v6
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: ${{ runner.os }}-fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-fuzz-corpus-${{ matrix.target }}-

      - name: Run fuzz target (2 hours)
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=7200

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crash-${{ matrix.target }}-${{ github.run_id }}
          path: fuzz/artifacts/${{ matrix.target }}/
